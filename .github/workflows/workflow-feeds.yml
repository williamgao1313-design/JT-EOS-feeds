name: feeds

on:
  schedule:
    # UTC 23:30 = 北京时间 07:30
    - cron: '30 23 * * *'
    # UTC 04:30 = 北京时间 12:30
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feeds-collector
  cancel-in-progress: false

jobs:
  collect:
    name: Collect feeds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect feeds
        run: node collect.mjs

      - name: Commit and push when changed
        run: |
          set -eu
          FILE="data/feeds/latest.json"
          # 每次运行必然变化的字段不代表内容变化：顶层 generatedAt 与各源的耗时 ms。
          # 先把它们抹掉再比对，避免"只换了时间戳"也提交一次。
          canon() {
            node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));delete d.generatedAt;for(const s of d.sources||[])delete s.ms;process.stdout.write(JSON.stringify(d));' "$1"
          }
          if git show "HEAD:$FILE" > /tmp/prev-latest.json 2>/dev/null; then
            if [ "$(canon /tmp/prev-latest.json)" = "$(canon "$FILE")" ]; then
              echo "No content changes in $FILE (only generatedAt / source timings differ) - nothing to commit."
              git checkout -- "$FILE"
              exit 0
            fi
          fi
          git config user.name "feeds-bot"
          git config user.email "feeds-bot@users.noreply.github.com"
          git add -- "$FILE"
          git commit -m "chore(feeds): update latest.json [skip ci]"
          git push
