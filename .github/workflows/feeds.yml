name: feeds

on:
  schedule:
    # UTC 23:30 = 北京时间 07:30
    - cron: '30 23 * * *'
    # UTC 04:30 = 北京时间 12:30
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feeds-collector
  cancel-in-progress: false

jobs:
  collect:
    name: Collect feeds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect feeds
        run: node collect.mjs

      - name: Commit and push when changed
        run: |
          set -eu
          FILE="data/feeds/latest.json"
          if [ -z "$(git status --porcelain -- "$FILE")" ]; then
            echo "No changes in $FILE - nothing to commit."
            exit 0
          fi
          git config user.name "feeds-bot"
          git config user.email "feeds-bot@users.noreply.github.com"
          git add -- "$FILE"
          git commit -m "chore(feeds): update latest.json [skip ci]"
          git push
